[project]
name = "twstock-algo"
version = "0.1.0"
description = "Algorithmic trading pipeline for the Taiwan stock market (TWSE)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "exchange-calendars>=4.13.2",
    "pandas",
    "pandera",
    "plotly>=6.7.0",
    "pyarrow",
    "python-dotenv",
    "requests",
    "streamlit>=1.57.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit",
    "pytest",
    "pytest-recording>=0.13.4",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--record-mode=none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twstock"]
