repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest smoke test
        entry: uv run pytest tests/test_smoke.py -q
        language: system
        pass_filenames: false
        always_run: true
